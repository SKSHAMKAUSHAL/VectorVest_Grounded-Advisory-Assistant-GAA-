name: GAA Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Quality, Testing & Security
  # -------------------------------------------------------------
  backend-test:
    name: Backend Tests & Security
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DISABLE_RATE_LIMITS: "true"
      JWT_SECRET_KEY: ci_test_secret_key_not_for_production_min_32_chars!
      OPENAI_API_KEY: ci_mock_key
      GROQ_API_KEY: ci_mock_key
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio httpx2

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/tests -v

  # -------------------------------------------------------------
  # Job 2: Frontend Lint, Unit Tests & Production Build
  # -------------------------------------------------------------
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Verify Next.js Production Build
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Docker Container Build Verification
  # -------------------------------------------------------------
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gaa-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gaa-frontend:latest
